<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CullSpace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="themeVeil" class="theme-veil" aria-hidden="true"></div>

    <div id="splash" class="splash">
      <div class="splash-stage">
        <div class="splash-ring"></div>
        <div class="splash-ring delay"></div>
        <img src="./icon.png?v=6" alt="CullSpace" class="splash-icon" />
      </div>
      <div class="splash-copy">
        <strong>CullSpace</strong>
        <span class="splash-sub">Starting…</span>
        <div class="splash-bar"><span></span></div>
      </div>
    </div>

    <div id="app" class="app hidden">
      <header class="toolbar">
        <div class="toolbar-brand">
          <img src="./icon.png?v=6" alt="" class="brand-icon" />
          <span class="brand-title">CullSpace</span>
        </div>
        <div class="toolbar-spacer"></div>
        <button id="btnSettings" type="button">Settings</button>
        <button id="btnLogs" type="button">Logs</button>
        <button id="btnHelp" type="button">Help</button>
        <button id="btnRefreshDrives" type="button">Refresh</button>
      </header>

      <section class="group drives-group">
        <div class="group-title">
          <span>Drives</span>
          <label class="check">
            <input id="includeNetwork" type="checkbox" />
            Include network / optical
          </label>
          <label class="check">
            <input id="includeProgramFiles" type="checkbox" />
            Include Program Files
          </label>
          <label class="check" id="dedupeFoldersWrap">
            <input id="dedupeDeepest" type="checkbox" checked />
            Unique folder savings
          </label>
        </div>
        <div id="driveList" class="drive-list"></div>
      </section>

      <nav class="tabstrip" role="tablist">
        <button class="tab active" data-tab="files" type="button" role="tab" aria-selected="true">Largest files</button>
        <button class="tab" data-tab="folders" type="button" role="tab" aria-selected="false">Folders</button>
        <button class="tab" data-tab="apps" type="button" role="tab" aria-selected="false">Installed apps</button>
        <span id="tabInk" class="tab-ink"></span>
      </nav>

      <section id="filesPane" class="content-pane">
        <div class="pane-toolbar">
          <input id="fileFilter" class="field grow" type="search" placeholder="Search files" />
          <label class="label-inline">
            Limit
            <input id="fileLimit" class="field" type="number" min="10" max="500" value="100" />
          </label>
          <button id="btnScanFiles" class="primary" type="button">Scan</button>
          <span id="scanStatus" class="status"></span>
        </div>
        <div id="fileSelectionBar" class="pane-toolbar selection-bar hidden">
          <span id="fileSelectionCount" class="selection-count">0 selected</span>
          <button type="button" id="btnClearFileSelection">Clear</button>
          <button type="button" class="danger" id="btnRemoveSelectedFiles">Remove selected…</button>
        </div>
        <div class="list-head files-head">
          <label class="col-check" title="Select all"><input type="checkbox" id="fileSelectAll" /></label>
          <span>Name</span>
          <span class="col-size">Size</span>
          <span></span>
        </div>
        <div id="fileResults" class="list-body"></div>
      </section>

      <section id="foldersPane" class="content-pane hidden">
        <div class="pane-toolbar">
          <div class="segmented folders-mode" role="group" aria-label="Folders mode">
            <button type="button" data-folders-mode="files">Files in folder</button>
            <button type="button" data-folders-mode="folders" class="active">Large folders</button>
          </div>
          <input
            id="folderRoot"
            class="field grow folders-files-only hidden"
            type="text"
            placeholder="Choose a folder to scan"
            readonly
          />
          <button id="btnBrowseFolder" class="folders-files-only hidden" type="button">Browse…</button>
          <span id="folderDirsHint" class="toolbar-hint grow folders-dirs-only">Uses selected drives above</span>
          <label class="label-inline">
            Limit
            <input id="folderLimit" class="field" type="number" min="10" max="500" value="100" />
          </label>
          <button id="btnScanFolderFiles" class="primary folders-files-only hidden" type="button">Scan</button>
          <button id="btnScanLargeFolders" class="primary folders-dirs-only" type="button">Scan</button>
          <span id="folderStatus" class="status"></span>
        </div>
        <div id="folderSelectionBar" class="pane-toolbar selection-bar hidden">
          <span id="folderSelectionCount" class="selection-count">0 selected</span>
          <button type="button" id="btnClearFolderSelection">Clear</button>
          <button type="button" class="danger" id="btnRemoveSelectedFolders">Remove selected…</button>
        </div>
        <div class="list-head files-head">
          <label class="col-check" title="Select all"><input type="checkbox" id="folderSelectAll" /></label>
          <span>Name</span>
          <span class="col-size">Size</span>
          <span></span>
        </div>
        <div id="folderResults" class="list-body"></div>
      </section>

      <section id="appsPane" class="content-pane hidden">
        <div class="pane-toolbar">
          <input id="appFilter" class="field grow" type="search" placeholder="Filter apps" />
          <button id="btnLoadApps" class="primary" type="button">Load apps</button>
          <span id="appStatus" class="status"></span>
        </div>
        <div id="appSelectionBar" class="pane-toolbar selection-bar hidden">
          <span id="appSelectionCount" class="selection-count">0 selected</span>
          <button type="button" id="btnClearAppSelection">Clear</button>
          <button type="button" class="danger" id="btnUninstallSelectedApps">Uninstall selected…</button>
        </div>
        <div class="list-head apps-head">
          <label class="col-check" title="Select all"><input type="checkbox" id="appSelectAll" /></label>
          <span>Application</span>
          <span class="col-size">Size</span>
          <span></span>
        </div>
        <div id="appResults" class="list-body"></div>
      </section>

      <footer class="statusbar">
        <span id="statusLeft" class="status-chip">Ready</span>
        <span id="statusRight" class="status-chip">Secure helper</span>
      </footer>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="modal">
        <div id="animScan" class="anim anim-scan hidden">
          <div class="scan-visual">
            <div class="radar"></div>
            <div class="scan-beam"></div>
            <div class="scan-dots">
              <i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
          <p>Scanning…</p>
          <div class="progress"><span></span></div>
        </div>
        <div id="animDelete" class="anim anim-delete hidden">
          <div class="delete-visual">
            <div class="burn"></div>
            <div class="shards">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
          </div>
          <p>Removing…</p>
          <div class="progress danger"><span></span></div>
        </div>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
